<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- Endereços antigos (saimo-tv.pages.dev, saimo-tv-f2w, saimo-tv2 e o www) levam ao saimo-tv.com.br com os dados do aparelho -->
    <script>
      (function () {
        var host = (location.hostname || '').toLowerCase();
        var CHAVES = [
          'tv-favorites', 'tv-last-channel', 'tv-volume', 'movie-volume', 'movie-skip-time',
          'current-movie-id', 'saimo-vod-favoritos', 'saimo-continuar', 'saimo-canais-personalizados',
          'saimo-ao-iniciar', 'saimo-upscaling', 'saimo-upscale-4k', 'saimo-upscale-hd',
          'saimo-zero-delay', 'saimo-audio-inteligente', 'saimo-buscas-recentes',
          'saimo-radios-recentes', 'saimo-entrada', 'saimo-telemetria-id', 'adult-mode-global'
        ];
        var PREFIXO = 'movie-progress-';

        // 1. ORIGEM: nos endereços antigos, exporta dados do localStorage e redireciona
        if (host === 'saimo-tv.pages.dev' || host === 'saimo-tv-f2w.pages.dev' || host === 'saimo-tv2.pages.dev' ||
            host === 'www.saimo-tv.com.br') {
          var dados = {};
          var temDados = false;
          try {
            for (var i = 0; i < CHAVES.length; i++) {
              var k = CHAVES[i];
              var v = localStorage.getItem(k);
              if (v !== null && typeof v === 'string' && v.length <= 200000) {
                dados[k] = v;
                temDados = true;
              }
            }
            for (var j = 0; j < localStorage.length; j++) {
              var lk = localStorage.key(j);
              if (lk && lk.indexOf(PREFIXO) === 0 && lk.length < 80) {
                var lv = localStorage.getItem(lk);
                if (lv !== null && typeof lv === 'string' && lv.length <= 100) {
                  dados[lk] = lv;
                  temDados = true;
                }
              }
            }
          } catch (e) {}

          var hash = location.hash || '';
          if (temDados) {
            try {
              var jsonStr = JSON.stringify(dados);
              var b64 = btoa(unescape(encodeURIComponent(jsonStr)))
                .replace(/\+/g, '-')
                .replace(/\//g, '_')
                .replace(/=+$/, '');
              hash = '#migrar=1.' + b64;
            } catch (e) {}
          }

          var destino = 'https://saimo-tv.com.br' + location.pathname + location.search + hash;
          location.replace(destino);
          return;
        }

        // 2. DESTINO: Se recebeu migração via hash (#migrar=1....), aplica automaticamente
        var h = location.hash || '';
        if (h.indexOf('#migrar=1.') === 0) {
          function limparHash() {
            try {
              history.replaceState(null, '', location.pathname + location.search);
            } catch (e) {}
          }
          try {
            var b = h.slice(10).replace(/-/g, '+').replace(/_/g, '/');
            while (b.length % 4) b += '=';
            var recebidos = JSON.parse(decodeURIComponent(escape(atob(b))));
            if (recebidos && typeof recebidos === 'object') {
              for (var chave in recebidos) {
                if (!Object.prototype.hasOwnProperty.call(recebidos, chave)) continue;
                var ok = CHAVES.indexOf(chave) >= 0 || (chave.indexOf(PREFIXO) === 0 && chave.length < 80);
                if (!ok) continue;
                var valor = recebidos[chave];
                if (typeof valor !== 'string' || valor.length > 200000) continue;
                var atual = localStorage.getItem(chave);
                if (atual === null) {
                  localStorage.setItem(chave, valor);
                } else if (chave.indexOf(PREFIXO) === 0) {
                  var nAtual = Number(atual) || 0;
                  var nNovo = Number(valor) || 0;
                  if (nNovo > nAtual) localStorage.setItem(chave, valor);
                } else {
                  try {
                    var arrAtual = JSON.parse(atual);
                    var arrNovo = JSON.parse(valor);
                    if (Array.isArray(arrAtual) && Array.isArray(arrNovo)) {
                      var vistos = {};
                      var combinados = [];
                      arrAtual.concat(arrNovo).forEach(function (x) {
                        var id = (x && typeof x === 'object') ? (x.id || (x.origem && x.origem.id) || JSON.stringify(x)) : String(x);
                        if (!vistos[id]) {
                          vistos[id] = 1;
                          combinados.push(x);
                        }
                      });
                      localStorage.setItem(chave, JSON.stringify(combinados));
                    }
                  } catch (e) {}
                }
              }
            }
          } catch (e) {}
          limparHash();
        }
      })();
    </script>
    <link rel="icon" type="image/png" href="%BASE_URL%favicon.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Saimo TV: um player para as listas e os links que você mesmo adiciona — no navegador, na TV, no celular e no computador." />
    <!-- Prévia do link no WhatsApp e redes sociais. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Saimo TV" />
    <meta property="og:title" content="Saimo TV" />
    <meta property="og:description" content="Um player para as listas e os links que você mesmo adiciona — no navegador, na TV, no celular e no computador." />
    <meta property="og:url" content="https://saimo-tv.com.br/" />
    <!-- Absoluto: WhatsApp e redes sociais não resolvem caminho relativo. -->
    <meta property="og:image" content="https://saimo-tv.com.br/icons/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:locale" content="pt_BR" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="https://saimo-tv.com.br/icons/icon-512.png" />
    <link rel="canonical" href="https://saimo-tv.com.br/" />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Fonte sem travar a primeira pintura: carrega por trás e troca quando chega. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <!-- O SDK do Chromecast só é baixado quando alguém usa o player (castService). -->
    <title>Saimo TV</title>
    <!-- Rede de segurança: se o app quebrar antes de desenhar (dado velho no
         navegador, módulo que não carregou), mostra o erro e como limpar, em vez
         de tela preta. -->
    <script>
      (function () {
        var erros = [];
        window.addEventListener('error', function (e) { erros.push((e.message || 'erro') + (e.filename ? ' @ ' + e.filename.split('/').pop() + ':' + e.lineno : '')); }, true);
        window.addEventListener('unhandledrejection', function (e) { var r = e.reason; erros.push(String(r && (r.message || r) || 'promessa rejeitada')); });
        setTimeout(function () {
          var raiz = document.getElementById('root');
          if (!raiz || raiz.childElementCount > 0) return;
          raiz.innerHTML = '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:32px;background:#0a0a0a;color:#fff;font-family:system-ui,sans-serif;text-align:center">' +
            '<h1 style="font-size:24px;margin:0">O Saimo TV não conseguiu abrir</h1>' +
            '<p style="max-width:560px;opacity:.8;margin:0;line-height:1.5">Algum dado guardado por uma versão anterior pode estar atrapalhando. Limpar os dados deste site resolve.</p>' +
            '<pre id="saimo-erro" style="max-width:90vw;white-space:pre-wrap;font-size:12px;opacity:.6;background:#16161c;padding:12px;border-radius:8px;text-align:left"></pre>' +
            '<div><button id="saimo-limpar" style="padding:12px 18px;border-radius:10px;border:0;background:#4fe3d0;color:#071311;font-weight:700;cursor:pointer">Limpar os dados do site e recarregar</button> ' +
            '<button onclick="location.reload()" style="padding:12px 18px;border-radius:10px;border:1px solid #444;background:transparent;color:#fff;cursor:pointer">Tentar de novo</button></div></div>';
          document.getElementById('saimo-erro').textContent = erros.join('\n') || 'Nenhum erro registrado (o código do site não carregou).';
          document.getElementById('saimo-limpar').onclick = function () {
            try { localStorage.clear(); sessionStorage.clear(); } catch (e) {}
            var fim = function () { location.reload(); };
            try {
              var p1 = navigator.serviceWorker ? navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }) : Promise.resolve();
              var p2 = window.caches ? caches.keys().then(function (ns) { return Promise.all(ns.map(function (n) { return caches.delete(n); })); }) : Promise.resolve();
              Promise.all([p1, p2]).then(fim, fim);
            } catch (e) { fim(); }
          };
        }, 10000);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
